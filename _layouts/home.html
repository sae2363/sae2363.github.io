<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <!-- Add other meta tags and links here -->
    <style>
        /* Your dropdown and header styles */
        header {
            background-color: #b0cefc;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: rgb(30, 30, 30);
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-menu {
            display: flex;
            gap: 20px;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown button {
            background-color: #0d6efd;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .dropdown button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 5px;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #ddd;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* General button styling */
        .btn {
            display: inline-block;
            background-color: #0d6efd;
            /* Blue background */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
            /* Remove underline from links */
            font-size: 16px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
            /* Darker blue on hover */
            transform: scale(1.05);
            /* Slight zoom effect */
        }

        /* Specific styling for Home button */
        .home-btn {
            background-color: #28a745;
            /* Green background for Home */
        }

        .home-btn:hover {
            background-color: #218838;
            /* Darker green on hover */
        }

        /* Specific styling for About button */
        .about-btn {
            background-color: #17a2b8;
            /* Teal background for About */
        }

        .about-btn:hover {
            background-color: #138496;
            /* Darker teal on hover */
        }
    </style>
</head>

<body>
    <!-- Header Section -->
    <header>
        <!-- Logo or Site Title -->
        <a href="/" class="logo">{{ site.title }}</a>

        <!-- Navigation Menu -->
        <nav class="nav-menu">
            <a href="{{ '/' | relative_url }}" class="btn home-btn">Home</a>
            <a href="{{ '/about/' | relative_url }}" class="btn about-btn">About</a>

            <!-- Dropdown Menu -->
            <div class="dropdown">
                <button>Menu</button>
                <div class="dropdown-content">
                    <a href="{{ '/projects/' | relative_url }}">Projects</a>
                    <a href="{{ '/experience/' | relative_url }}">Experience</a>
                    <a href="{{ '/interest/' | relative_url }}">Interest</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <div class="content">
        {{ content }}
    </div>

</body>

</html>
